volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: lkofe1/kittygram_backend:latest
    env_file: .env
    volumes:
      - static:/app/static/
      - media:/app/media/
    depends_on:
      - db

  frontend:
    image: lkofe1/kittygram_frontend:latest
    env_file: .env
    volumes:
      - static:/static

  gateway:
    image: lkofe1/kittygram_gateway:latest
    env_file: .env
    ports:
      - "80:80"
    volumes:
      - static:/static/
      - media:/media/
    depends_on:
      - backend
      - frontend
